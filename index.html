<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>供应链管理教学工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">供应链管理教学工具</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item" v-for="(item, index) in navItems" :key="index">
                            <a class="nav-link" :class="{ active: currentPage === index }" @click="switchPage(index)">{{ item }}</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container main-content">
            <!-- 首页 -->
            <div v-show="currentPage === 0">
                <h2 class="mb-4">首页</h2>
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">销售趋势</h5>
                                <div id="chart1" class="chart-container"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">库存结构</h5>
                                <div id="chart2" class="chart-container"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 基础资料 -->
            <div v-show="currentPage === 1">
                <basic-data-module></basic-data-module>
            </div>

            <!-- 生产计划 -->
            <div v-show="currentPage === 2">
                <production-plan-module></production-plan-module>
            </div>

            <!-- 采购计划 -->
            <div v-show="currentPage === 3">
                <purchase-plan-module></purchase-plan-module>
            </div>

            <!-- 库存管理 -->
            <div v-show="currentPage === 4">
                <inventory-module></inventory-module>
            </div>

            <!-- 数据管理 -->
            <div v-show="currentPage === 5">
                <data-manager-module></data-manager-module>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
