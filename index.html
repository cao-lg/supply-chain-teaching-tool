<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>供应链管理教学工具</title>
    <link href="https://unpkg.com/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">供应链管理教学工具</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item" v-for="(item, index) in navItems" :key="index">
                            <a class="nav-link" :class="{ active: currentPage === index }" @click="switchPage(index)">{{ item }}</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container main-content">
            <!-- 首页 -->
            <div v-show="currentPage === 0">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>供应链管理系统</h2>
                    <div class="text-muted">欢迎使用供应链管理教学工具</div>
                </div>
                
                <!-- 关键指标概览 -->
                <div class="row mb-6">
                    <div class="col-lg-3 col-md-6 mb-4">
                        <div class="card border-left-primary shadow h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                            总销售额</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800">¥128,500</div>
                                        <div class="text-xs text-success mt-1"><i class="fas fa-arrow-up"></i> 12.5%</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-dollar-sign fa-2x text-gray-300"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 mb-4">
                        <div class="card border-left-success shadow h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                                            库存水平</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800">85%</div>
                                        <div class="text-xs text-success mt-1"><i class="fas fa-arrow-up"></i> 3.2%</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-warehouse fa-2x text-gray-300"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 mb-4">
                        <div class="card border-left-warning shadow h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">
                                            生产效率</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800">92%</div>
                                        <div class="text-xs text-danger mt-1"><i class="fas fa-arrow-down"></i> 1.8%</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-industry fa-2x text-gray-300"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 mb-4">
                        <div class="card border-left-info shadow h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-info text-uppercase mb-1">
                                            订单数量</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800">248</div>
                                        <div class="text-xs text-success mt-1"><i class="fas fa-arrow-up"></i> 8.7%</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-shopping-cart fa-2x text-gray-300"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 图表区域 -->
                <div class="row mb-6">
                    <div class="col-lg-6 mb-4">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">销售趋势</h6>
                            </div>
                            <div class="card-body">
                                <div class="chart-area">
                                    <div id="chart1" class="chart-container"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 mb-4">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">库存结构</h6>
                            </div>
                            <div class="card-body">
                                <div class="chart-area">
                                    <div id="chart2" class="chart-container"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-12 mb-4">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">生产计划执行情况</h6>
                            </div>
                            <div class="card-body">
                                <div class="chart-area">
                                    <div id="chart3" class="chart-container"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 快速导航区域 -->
                <div class="row mb-6">
                    <div class="col-12 mb-4">
                        <h3 class="h4 mb-3 font-weight-bold text-gray-800">快速导航</h3>
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            <div class="card border-0 shadow-sm card-hover" @click="switchPage(1)">
                                <div class="card-body text-center p-4">
                                    <i class="fas fa-database fa-3x text-primary mb-3"></i>
                                    <h5 class="card-title">基础资料</h5>
                                </div>
                            </div>
                            <div class="card border-0 shadow-sm card-hover" @click="switchPage(2)">
                                <div class="card-body text-center p-4">
                                    <i class="fas fa-calendar-alt fa-3x text-success mb-3"></i>
                                    <h5 class="card-title">生产计划</h5>
                                </div>
                            </div>
                            <div class="card border-0 shadow-sm card-hover" @click="switchPage(3)">
                                <div class="card-body text-center p-4">
                                    <i class="fas fa-shopping-basket fa-3x text-warning mb-3"></i>
                                    <h5 class="card-title">采购计划</h5>
                                </div>
                            </div>
                            <div class="card border-0 shadow-sm card-hover" @click="switchPage(4)">
                                <div class="card-body text-center p-4">
                                    <i class="fas fa-warehouse fa-3x text-info mb-3"></i>
                                    <h5 class="card-title">库存管理</h5>
                                </div>
                            </div>
                            <div class="card border-0 shadow-sm card-hover" @click="switchPage(5)">
                                <div class="card-body text-center p-4">
                                    <i class="fas fa-cogs fa-3x text-primary mb-3"></i>
                                    <h5 class="card-title">生产能力</h5>
                                </div>
                            </div>
                            <div class="card border-0 shadow-sm card-hover" @click="switchPage(6)">
                                <div class="card-body text-center p-4">
                                    <i class="fas fa-chart-line fa-3x text-success mb-3"></i>
                                    <h5 class="card-title">需求预测</h5>
                                </div>
                            </div>
                            <div class="card border-0 shadow-sm card-hover" @click="switchPage(7)">
                                <div class="card-body text-center p-4">
                                    <i class="fas fa-truck fa-3x text-warning mb-3"></i>
                                    <h5 class="card-title">物流配送</h5>
                                </div>
                            </div>
                            <div class="card border-0 shadow-sm card-hover" @click="switchPage(8)">
                                <div class="card-body text-center p-4">
                                    <i class="fas fa-headset fa-3x text-info mb-3"></i>
                                    <h5 class="card-title">客户服务</h5>
                                </div>
                            </div>
                            <div class="card border-0 shadow-sm card-hover" @click="switchPage(9)">
                                <div class="card-body text-center p-4">
                                    <i class="fas fa-chart-pie fa-3x text-primary mb-3"></i>
                                    <h5 class="card-title">数据分析</h5>
                                </div>
                            </div>
                            <div class="card border-0 shadow-sm card-hover" @click="switchPage(10)">
                                <div class="card-body text-center p-4">
                                    <i class="fas fa-tools fa-3x text-success mb-3"></i>
                                    <h5 class="card-title">数据管理</h5>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 系统活动和通知区域 -->
                <div class="row">
                    <div class="col-lg-12 mb-4">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h6 class="m-0 font-weight-bold text-primary">系统活动</h6>
                                    <a href="#" class="text-muted text-sm">查看全部</a>
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="list-group">
                                    <div class="list-group-item">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h6 class="font-weight-bold">生产计划已更新</h6>
                                                <p class="text-sm text-muted">今日 10:30</p>
                                            </div>
                                            <span class="badge bg-success">已完成</span>
                                        </div>
                                    </div>
                                    <div class="list-group-item">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h6 class="font-weight-bold">库存水平低于阈值</h6>
                                                <p class="text-sm text-muted">今日 09:15</p>
                                            </div>
                                            <span class="badge bg-warning">需要关注</span>
                                        </div>
                                    </div>
                                    <div class="list-group-item">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h6 class="font-weight-bold">采购订单已确认</h6>
                                                <p class="text-sm text-muted">昨日 16:45</p>
                                            </div>
                                            <span class="badge bg-info">处理中</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 基础资料 -->
            <div v-show="currentPage === 1">
                <basic-data-module></basic-data-module>
            </div>

            <!-- 生产计划 -->
            <div v-show="currentPage === 2">
                <production-plan-module></production-plan-module>
            </div>

            <!-- 采购计划 -->
            <div v-show="currentPage === 3">
                <purchase-plan-module></purchase-plan-module>
            </div>

            <!-- 库存管理 -->
            <div v-show="currentPage === 4">
                <inventory-module></inventory-module>
            </div>

            <!-- 生产能力管理 -->
            <div v-show="currentPage === 5">
                <production-capacity-module></production-capacity-module>
            </div>

            <!-- 需求预测 -->
            <div v-show="currentPage === 6">
                <demand-forecast-module></demand-forecast-module>
            </div>

            <!-- 物流配送 -->
            <div v-show="currentPage === 7">
                <logistics-module></logistics-module>
            </div>

            <!-- 客户服务 -->
            <div v-show="currentPage === 8">
                <customer-service-module></customer-service-module>
            </div>

            <!-- 数据分析 -->
            <div v-show="currentPage === 9">
                <data-analysis-module></data-analysis-module>
            </div>

            <!-- 数据管理 -->
            <div v-show="currentPage === 10">
                <data-manager-module></data-manager-module>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
